<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>切牙 · 交互审阅</title><style>body{margin:0;background:#10151c;color:#e5ecf4;font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}a{color:#92c8ff}nav,.links{display:flex;gap:16px;flex-wrap:wrap}section{background:#19222d;padding:22px;border-radius:12px;margin:22px 0}select{font:inherit;padding:8px;background:#263444;color:inherit;border:1px solid #53657a;border-radius:6px}h1,h2{line-height:1.3}.muted{color:#adbdcf}.notice{border-left:3px solid #e4a455;padding-left:16px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #405164;padding:8px;text-align:left;vertical-align:top}.table{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{margin:32px 0;color:#adbdcf}</style></head><body><main><nav><a href="../index.html">全部批次</a><a href="report.html">逐例说明</a></nav><h1>切牙 · 交互审阅</h1><p>共 9 例，沿用已审阅版本的真实模型与配准质量记录。</p><section><label for="case">选择样本 </label><select id="case"><option value="pack1_11_3">pack1_11_3</option><option value="pack2_11_1">pack2_11_1</option><option value="pack2_11_3">pack2_11_3</option><option value="additional_11_0" selected>additional_11_0</option><option value="additional_11_2">additional_11_2</option><option value="pack1_11_4">pack1_11_4</option><option value="pack2_11_2">pack2_11_2</option><option value="pack2_11_4">pack2_11_4</option><option value="additional_11_1">additional_11_1</option></select><p class="links"><a data-stage="registration" href="viewer/registration.html?stage=registration&amp;view=front#additional_11_0">备牙前后配准</a><a data-stage="extraction" href="viewer/registration.html?stage=extraction&amp;view=front#additional_11_0">单牙提取</a><a data-stage="segmentation" href="viewer/registration.html?stage=segmentation&amp;view=front#additional_11_0">牙面与肩台分区</a><a id="shoulder" href="viewer/shoulder.html#additional_11_0">肩台前后对照与闭环依据</a></p></section><p class="notice">配准低置信、残留缺壁和肩台边界问题均保留。闭环与连续性不等于解剖准确；详细观察见逐例说明。</p></main><script>const s=document.getElementById('case');const wanted=decodeURIComponent(location.hash.slice(1));if([...s.options].some(o=>o.value===wanted))s.value=wanted;function update(){const id=encodeURIComponent(s.value);for(const a of document.querySelectorAll('[data-stage]'))a.href='viewer/registration.html?stage='+a.dataset.stage+'&view=front#'+id;document.getElementById('shoulder').href='viewer/shoulder.html#'+id;history.replaceState(null,'','#'+id)}s.onchange=update;update();</script></body></html>
